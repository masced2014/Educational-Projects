# Grype configuration for rust_file_encrypt
# https://github.com/anchore/grype#configuration

# Only report medium severity and above (matches the workflow policy).
fail-on-severity: critical

# Ignore known false positives.
# Each entry MUST include a justification so the suppression can be reviewed
# during periodic security audits.
ignore:
  # GHSA-cxww-7g56-2vh6 — actions/download-artifact arbitrary file write (zip-slip)
  # Affected : >= 4.0.0, < 4.1.3
  # Patched  : 4.1.3  (https://github.com/advisories/GHSA-cxww-7g56-2vh6)
  # Reason   : Syft resolves the "@v4" floating tag to 4.1.3, which IS the
  #            patched release. Grype's range match incorrectly catches the
  #            boundary. The workflow now pins actions/download-artifact@v8
  #            which is far outside the vulnerable range.
  - vulnerability: GHSA-cxww-7g56-2vh6
    package:
      name: actions/download-artifact
      type: github-action

# Show both fixed and unfixed to track remediation progress over time.
only-fixed: false

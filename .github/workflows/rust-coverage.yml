name: Rust Coverage

on:
  push:
    branches: [ main ]
    paths:
      - rust_file_encrypt/**
      - .github/workflows/rust-coverage.yml
  pull_request:
    branches: [ main ]
    paths:
      - rust_file_encrypt/**
      - .github/workflows/rust-coverage.yml

permissions:
  contents: read

jobs:
  coverage:
    name: Test coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_file_encrypt

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust_file_encrypt/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Enforce ≥ 95% line coverage
        run: |
          cargo llvm-cov --all-features --workspace --summary-only 2>&1 | tee coverage-summary.txt
          COVERAGE=$(grep -oP 'Line\s+\K[\d.]+(?=%)' coverage-summary.txt | tail -1)
          echo "Line coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { if (cov + 0 < 95) { print "Coverage " cov "% is below the 95% threshold"; exit 1 } }'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: rust_file_encrypt/lcov.info
          flags: rust
          fail_ci_if_error: false

name: Rust SBOM

on:
  push:
    branches: [ main ]
    paths:
      - 'rust_file_encrypt/**'
      - '.github/workflows/rust-sbom.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'rust_file_encrypt/**'
      - '.github/workflows/rust-sbom.yml'

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  generate-sbom:
    name: Generate SBOM (Syft)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: rust_file_encrypt
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
          upload-artifact-retention: 90

  scan-vulnerabilities:
    name: Scan for vulnerabilities (Grype)
    runs-on: ubuntu-latest
    needs: generate-sbom

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom.cdx.json
          path: .

      - name: Scan SBOM with Grype
        id: grype-scan
        uses: anchore/scan-action@v6
        with:
          sbom: sbom.cdx.json/sbom.cdx.json
          output-format: sarif
          fail-build: true
          severity-cutoff: critical

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}

      - name: Post vulnerability summary as PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const sarif = JSON.parse(fs.readFileSync('${{ steps.grype-scan.outputs.sarif }}', 'utf8'));
            const results = sarif.runs?.[0]?.results ?? [];
            const critical = results.filter(r => r.level === 'error');
            const high = results.filter(r => r.level === 'warning');
            const body = [
              `## Grype Vulnerability Scan Results`,
              `- **Critical**: ${critical.length}`,
              `- **High**: ${high.length}`,
              `- **Total findings**: ${results.length}`,
              results.length > 0
                ? '\nSee the **Security → Code scanning** tab for full details.'
                : '\nNo vulnerabilities found.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

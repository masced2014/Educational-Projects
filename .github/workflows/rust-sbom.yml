name: SBOM & Vulnerability Scan (rust_file_encrypt)

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'rust_file_encrypt/**'
      - '.github/workflows/rust-sbom.yml'
  push:
    branches: [ main ]
    paths:
      - 'rust_file_encrypt/**'
      - '.github/workflows/rust-sbom.yml'

# Minimal permissions following the principle of least privilege.
permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  CARGO_TERM_COLOR: always
  SBOM_FILE: rust_file_encrypt/sbom.cdx.json

jobs:
  # ── Job 1: generate the SBOM ──────────────────────────────────────────────
  generate-sbom:
    name: Generate SBOM (Syft / CycloneDX)
    runs-on: ubuntu-latest

    outputs:
      sbom-artifact: ${{ steps.generate.outputs.artifact-name }}

    defaults:
      run:
        working-directory: rust_file_encrypt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust_file_encrypt/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust_file_encrypt/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Ensure Cargo.lock is present
        run: cargo generate-lockfile

      # anchore/sbom-action wraps Syft.
      # Format: cyclonedx-json → broad toolchain support (grype, Dependency-Track, etc.)
      - name: Generate SBOM with Syft
        id: generate
        uses: anchore/sbom-action@v0
        with:
          path: rust_file_encrypt/
          format: cyclonedx-json
          output-file: ${{ env.SBOM_FILE }}
          artifact-name: sbom-${{ github.sha }}.cdx.json
          upload-artifact: true
          upload-artifact-retention: 90

      - name: Display SBOM component summary
        run: |
          SBOM="$GITHUB_WORKSPACE/${{ env.SBOM_FILE }}"
          echo "──────────────────────────────────────────────"
          echo "SBOM written to: ${{ env.SBOM_FILE }}"
          echo "Unique components: $(jq '.components | length' "$SBOM")"
          echo "Spec version : $(jq -r '.specVersion'          "$SBOM")"
          echo "Serial number: $(jq -r '.serialNumber'         "$SBOM")"
          echo "──────────────────────────────────────────────"

  # ── Job 2: scan the SBOM for CVEs with Grype ──────────────────────────────
  scan-vulnerabilities:
    name: Vulnerability Scan (Grype)
    runs-on: ubuntu-latest
    needs: generate-sbom

    defaults:
      run:
        working-directory: rust_file_encrypt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download SBOM artifact
        uses: actions/download-artifact@v8
        with:
          name: sbom-${{ github.sha }}.cdx.json
          path: rust_file_encrypt/

      # anchore/scan-action runs Grype against the SBOM.
      - name: Scan SBOM with Grype
        id: grype
        uses: anchore/scan-action@v7
        with:
          sbom: ${{ env.SBOM_FILE }}
          fail-build: false
          severity-cutoff: medium
          output-format: sarif
          only-fixed: false

      - name: Upload Grype SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-sbom-scan

      - name: Archive SBOM and scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-artefacts-${{ github.sha }}
          path: |
            ${{ env.SBOM_FILE }}
            ${{ steps.grype.outputs.sarif }}
          retention-days: 90

      # ── Vulnerability threshold enforcement ────────────────────────────────
      - name: Enforce vulnerability threshold (CRITICAL = build-breaker)
        id: threshold
        run: |
          SARIF="$GITHUB_WORKSPACE/${{ steps.grype.outputs.sarif }}"

          CRITICAL=$(jq '[.runs[].results[] | select(.level == "error")]   | length' "$SARIF")
          HIGH=$(    jq '[.runs[].results[] | select(.level == "warning")] | length' "$SARIF")
          MEDIUM=$(  jq '[.runs[].results[] | select(.level == "note")]    | length' "$SARIF")
          TOTAL=$(   jq '[.runs[].results[]]                               | length' "$SARIF")

          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH"         >> "$GITHUB_OUTPUT"
          echo "medium=$MEDIUM"     >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL"       >> "$GITHUB_OUTPUT"

          echo "──────────────────────────────────────────────"
          echo "Grype scan results"
          echo "  Critical : $CRITICAL"
          echo "  High     : $HIGH"
          echo "  Medium   : $MEDIUM"
          echo "  Total    : $TOTAL"
          echo "──────────────────────────────────────────────"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ $CRITICAL critical vulnerability/vulnerabilities found – blocking merge."
            exit 1
          fi

          echo "✅ No critical vulnerabilities detected."

      # ── PR comment ─────────────────────────────────────────────────────────
      - name: Post vulnerability summary as PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const critical = '${{ steps.threshold.outputs.critical }}';
            const high     = '${{ steps.threshold.outputs.high }}';
            const medium   = '${{ steps.threshold.outputs.medium }}';
            const total    = '${{ steps.threshold.outputs.total }}';

            const passed   = critical === '0';
            const badge    = passed ? '✅ PASSED' : '❌ FAILED – critical CVEs detected';
            const advice   = passed
              ? '> No critical vulnerabilities found. Review high / medium findings as part of normal triage.'
              : '> **Action required**: resolve all critical CVEs before this PR can be merged.';

            const sha = context.sha.substring(0, 7);

            const body = [
              `## 🔍 SBOM & Vulnerability Scan (rust_file_encrypt) — ${badge}`,
              '',
              `| Severity | Count |`,
              `|---|---|`,
              `| 🔴 Critical | **${critical}** |`,
              `| 🟠 High     | ${high} |`,
              `| 🟡 Medium   | ${medium} |`,
              `| **Total**   | **${total}** |`,
              '',
              advice,
              '',
              `**SBOM**: \`sbom-${context.sha}.cdx.json\` (CycloneDX JSON) — [download from workflow artifacts](../../actions/runs/${{ github.run_id }})`,
              '',
              `📋 Full findings are available in the [Security → Code scanning](../../security/code-scanning) tab (SARIF uploaded by commit \`${sha}\`).`,
            ].join('\n');

            const marker = '## 🔍 SBOM & Vulnerability Scan (rust_file_encrypt)';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

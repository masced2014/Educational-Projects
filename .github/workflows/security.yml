name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 08:00 UTC to catch newly published advisories
    - cron: "0 8 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  # ── cargo audit ────────────────────────────────────────────────────────────
  cargo-audit:
    name: Rust – cargo audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_file_encrypt

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('rust_file_encrypt/Cargo.lock') }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  # ── CodeQL analysis ────────────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ "rust" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build rust_file_encrypt for CodeQL
        working-directory: rust_file_encrypt
        run: cargo build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

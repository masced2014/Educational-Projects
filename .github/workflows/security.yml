name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 08:00 UTC to catch newly published advisories
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  # ── cargo audit ────────────────────────────────────────────────────────────
  cargo-audit:
    name: Rust – cargo audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_file_encrypt

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo audit
        uses: actions-rust-lang/audit@v1
        with:
            file: rust_file_encrypt/Cargo.lock
